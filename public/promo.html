<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推广合作 - 我的博客</title>
  <meta name="description" content="推广合作页面">
  <link rel="stylesheet" href="/css/style.css?v=20260921">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <div class="logo-icon">G</div>
        <span id="site-title">我的博客</span>
      </a>
      <div class="logo-actions">
        <a href="/admin/post-edit.html" class="logo-action-btn primary">✏️ 写文章</a>
        <a href="/#friend-links" class="logo-action-btn">🔗 链接</a>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="/">首页</a></li>
          <li><a href="/search.html">搜索</a></li>
          <li><a href="/contact.html">联系我</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <div style="padding:40px 0;">
      <div class="card" style="padding:40px;">
        <div id="promo-content">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-bottom" style="padding:20px;">
      <p>&copy; <span id="current-year"></span> 我的博客. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/app.js?v=20260921"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      try {
        const { settings } = await api.settings.get();
        if (settings.site_title) {
          document.getElementById('site-title').textContent = settings.site_title;
        }
        if (settings.promo_content) {
          document.getElementById('promo-content').innerHTML = settings.promo_content;
        } else {
          document.getElementById('promo-content').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📢</div>
              <h3>推广页面</h3>
              <p>此页面内容可在管理后台设置</p>
            </div>
          `;
        }
      } catch (e) {
        document.getElementById('promo-content').innerHTML = '<div class="alert alert-error">加载失败</div>';
      }
    });
  </script>
</body>
</html>
