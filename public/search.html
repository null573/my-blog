<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 - 我的博客</title>
  <link rel="stylesheet" href="/css/style.css?v=20260917">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <div class="logo-icon">G</div>
        <span id="site-title">我的博客</span>
      </a>
      <div class="logo-actions">
        <a href="/admin/post-edit.html" class="logo-action-btn primary">✏️ 写文章</a>
        <a href="/#friend-links" class="logo-action-btn">🔗 链接</a>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="/">首页</a></li>
          <li><a href="/search.html" class="active">搜索</a></li>
          <li><a href="/contact.html">联系我</a></li>
          <li id="admin-link" style="display:none;"><a href="/admin/">管理</a></li>
        </ul>
      </nav>
      <div class="nav-right">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜索文章..." onkeypress="if(event.key==='Enter')doSearch()">
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="main-layout">
      <main>
        <div class="card" style="padding:30px;margin-bottom:20px;">
          <h1 style="margin-bottom:20px;">🔍 搜索</h1>
          <div style="display:flex;gap:12px;">
            <input type="text" id="main-search-input" placeholder="输入关键词搜索文章..." 
                   style="flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);font-size:16px;outline:none;"
                   onkeypress="if(event.key==='Enter')doMainSearch()">
            <button class="btn btn-primary" onclick="doMainSearch()">搜索</button>
          </div>
        </div>

        <div id="search-results">
          <div class="card" style="padding:40px;text-align:center;color:var(--text-light);">
            <div style="font-size:48px;margin-bottom:16px;">🔎</div>
            <h3>输入关键词开始搜索</h3>
            <p>支持搜索文章标题、内容和摘要</p>
          </div>
        </div>

        <div id="pagination"></div>
      </main>

      <aside class="sidebar">
        <div class="widget" id="ad-widget">
          <div class="ad-space">
            <div class="ad-space-title">广告位</div>
            <p style="font-size:13px;color:var(--text-light);">您的广告可以在这里展示</p>
          </div>
        </div>

        <div class="widget">
          <h3 class="widget-title">友情链接</h3>
          <ul class="links-list" id="links-list">
            <li style="color:var(--text-light);font-size:14px;">加载中...</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h4>关于博客</h4>
        <p id="footer-desc">这是一个分享技术与生活的个人博客，记录成长的点滴。</p>
      </div>
      <div class="footer-section">
        <h4>快速链接</h4>
        <ul>
          <li><a href="/">首页</a></li>
          <li><a href="/search.html">搜索</a></li>
          <li><a href="/contact.html">联系我</a></li>
          <li><a href="/admin/login.html">管理员登录</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h4>联系方式</h4>
        <p id="footer-contact">邮箱: admin@example.com</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; <span id="current-year"></span> 我的博客. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/app.js?v=20260917"></script>
  <script>
    let currentQuery = '';

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      // 加载设置
      try {
        const { settings } = await api.settings.get();
        if (settings.site_title) {
          document.getElementById('site-title').textContent = settings.site_title;
        }
        if (settings.site_description) {
          document.getElementById('footer-desc').textContent = settings.site_description;
        }
        if (settings.contact_info) {
          document.getElementById('footer-contact').innerHTML = settings.contact_info.replace(/\n/g, '<br>');
        }
        if (settings.ad_code) {
          document.getElementById('ad-widget').innerHTML = settings.ad_code;
        }
      } catch (e) {
        console.error('加载设置失败', e);
      }

      if (api.isLoggedIn()) {
        document.getElementById('admin-link').style.display = 'block';
      }

      loadLinks();

      // 从URL获取搜索词
      const q = utils.getQueryParam('q');
      if (q) {
        currentQuery = q;
        document.getElementById('main-search-input').value = q;
        document.getElementById('search-input').value = q;
        doSearchFromUrl();
      }
    });

    function doSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (query) {
        window.location.href = `/search.html?q=${encodeURIComponent(query)}`;
      }
    }

    function doMainSearch() {
      const query = document.getElementById('main-search-input').value.trim();
      if (query) {
        window.location.href = `/search.html?q=${encodeURIComponent(query)}`;
      }
    }

    async function doSearchFromUrl() {
      const page = parseInt(utils.getQueryParam('page') || '1');
      const container = document.getElementById('search-results');
      utils.showLoading(container);

      try {
        const data = await api.search(currentQuery, page, 10);
        
        document.title = `"${currentQuery}" 的搜索结果 - 我的博客`;

        if (data.posts.length === 0) {
          container.innerHTML = `
            <div class="card" style="padding:40px;text-align:center;">
              <div style="font-size:48px;margin-bottom:16px;">😕</div>
              <h3>没有找到相关文章</h3>
              <p style="color:var(--text-light);margin-top:8px;">试试其他关键词吧</p>
            </div>
          `;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        let html = `<div style="margin-bottom:16px;color:var(--text-light);">找到 ${data.total} 篇关于 "${utils.escapeHtml(currentQuery)}" 的文章</div>`;
        
        data.posts.forEach(post => {
          // 高亮关键词
          const highlightedTitle = highlightText(post.title, currentQuery);
          const highlightedSummary = highlightText(post.summary || '', currentQuery);
          
          html += `
            <article class="card post-card">
              <h2><a href="/post/${encodeURIComponent(post.slug)}">${highlightedTitle}</a></h2>
              <div class="post-meta">
                <span>📅 ${utils.formatDate(post.created_at)}</span>
                <span>👁️ ${post.views} 阅读</span>
              </div>
              <p class="post-summary">${highlightedSummary}</p>
              <a href="/post/${encodeURIComponent(post.slug)}" class="btn btn-primary btn-sm">阅读全文 →</a>
            </article>
          `;
        });

        container.innerHTML = html;

        // 分页
        renderPagination(page, data.totalPages);
      } catch (e) {
        container.innerHTML = `<div class="alert alert-error">搜索失败: ${e.message}</div>`;
      }
    }

    function highlightText(text, keyword) {
      if (!keyword) return utils.escapeHtml(text);
      const escaped = utils.escapeHtml(text);
      const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return escaped.replace(regex, '<mark style="background:#fef08a;padding:2px 4px;border-radius:2px;">$1</mark>');
    }

    function renderPagination(currentPage, totalPages) {
      const pagination = document.getElementById('pagination');
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let html = '<div class="pagination">';
      
      if (currentPage > 1) {
        html += `<a href="/search.html?q=${encodeURIComponent(currentQuery)}&page=${currentPage - 1}">← 上一页</a>`;
      } else {
        html += `<span class="disabled">← 上一页</span>`;
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += i === currentPage 
            ? `<span class="current">${i}</span>`
            : `<a href="/search.html?q=${encodeURIComponent(currentQuery)}&page=${i}">${i}</a>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += `<span>...</span>`;
        }
      }

      if (currentPage < totalPages) {
        html += `<a href="/search.html?q=${encodeURIComponent(currentQuery)}&page=${currentPage + 1}">下一页 →</a>`;
      } else {
        html += `<span class="disabled">下一页 →</span>`;
      }

      html += '</div>';
      pagination.innerHTML = html;
    }

    async function loadLinks() {
      try {
        const { links } = await api.links.list();
        const list = document.getElementById('links-list');
        
        if (links.length === 0) {
          list.innerHTML = '<li style="color:var(--text-light);font-size:14px;">暂无链接</li>';
          return;
        }

        list.innerHTML = links.map(link => `
          <li>
            <a href="${utils.escapeHtml(link.url)}" target="_blank" rel="noopener">
              <span class="link-icon">${link.name.charAt(0).toUpperCase()}</span>
              <span>${utils.escapeHtml(link.name)}</span>
            </a>
          </li>
        `).join('');
      } catch (e) {
        document.getElementById('links-list').innerHTML = '<li style="color:var(--danger);font-size:14px;">加载失败</li>';
      }
    }
  </script>
</body>
</html>
