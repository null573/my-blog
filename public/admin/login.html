<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 我的博客</title>
  <link rel="stylesheet" href="/css/style.css?v=20260918">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="width:64px;height:64px;background:linear-gradient(135deg,var(--primary),#8b5cf6);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:white;font-size:28px;font-weight:bold;margin-bottom:12px;">G</div>
      </div>
      <h1>管理员登录</h1>
      <p class="subtitle">请输入您的管理员账号</p>
      
      <div id="message"></div>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">登 录</button>
      </form>
      
      <div style="margin-top:20px;text-align:center;">
        <a href="/" style="font-size:14px;">← 返回博客首页</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js?v=20260918"></script>
  <script>
    function getRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('redirect') || '';
      if (!raw.startsWith('/') || raw.startsWith('//') || raw.includes('\\')) {
        return '/admin/';
      }
      return raw;
    }

    if (api.isLoggedIn()) {
      window.location.href = getRedirectTarget();
    }

    async function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');

      if (!username || !password) {
        messageDiv.innerHTML = '<div class="alert alert-error">请输入用户名和密码</div>';
        return;
      }

      try {
        const result = await api.admin.login(username, password);
        api.setToken(result.token);
        messageDiv.innerHTML = '<div class="alert alert-success">登录成功，正在跳转...</div>';
        setTimeout(() => {
          window.location.href = getRedirectTarget();
        }, 500);
      } catch (e) {
        messageDiv.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
