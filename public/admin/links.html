<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友情链接 - 博客管理</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <style>
    /* 移动端优化：卡片式列表 */
    .link-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .link-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .link-card-name {
      font-weight: 600;
      font-size: 16px;
    }
    .link-card-url {
      font-size: 13px;
      color: var(--text-light);
      word-break: break-all;
      margin-bottom: 6px;
    }
    .link-card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .link-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .link-card-actions {
      display: flex;
      gap: 8px;
    }
    .link-card-actions .btn {
      min-height: 40px;
      min-width: 64px;
      padding: 8px 16px;
      font-size: 14px;
    }
    .link-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-light);
    }
    /* 桌面端表格：长链接换行，操作列始终可见 */
    .links-table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .links-table-container .data-table {
      table-layout: fixed;
      min-width: 720px;
    }
    .links-table-container .data-table th,
    .links-table-container .data-table td {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .links-table-container .col-id {
      width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      color: var(--text-light);
    }
    .links-table-container .col-url {
      width: 34%;
      font-size: 13px;
    }
    .links-table-container .col-desc {
      width: 18%;
    }
    .links-table-container .col-sort {
      width: 64px;
      white-space: nowrap;
    }
    .links-table-container .col-status {
      width: 76px;
      white-space: nowrap;
    }
    .links-table-container .col-actions {
      width: 132px;
      white-space: nowrap;
    }
    .links-table-container .col-actions .table-actions {
      flex-wrap: nowrap;
    }
    @media (max-width: 768px) {
      .links-table-container {
        display: none;
      }
      .links-mobile-list {
        display: block;
      }
    }
    @media (min-width: 769px) {
      .links-table-container {
        display: block;
      }
      .links-mobile-list {
        display: none;
      }
    }
    /* 模态框移动端优化 */
    @media (max-width: 480px) {
      .modal-overlay {
        padding: 0;
        align-items: flex-end;
      }
      .modal {
        max-height: 85vh;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }
      .modal-footer .btn {
        min-height: 44px;
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let allLinks = [];

    if (!checkAdminAuth()) {
      // 未登录会跳转
    } else {
      renderPage();
    }

    function renderPage() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="admin-layout">
          ${renderAdminSidebar('links')}
          <main class="admin-content">
            <div class="admin-header">
              <h1>🔗 友情链接</h1>
              <button class="btn btn-primary" onclick="showAddModal()">+ 添加链接</button>
            </div>
            <div class="admin-card">
              <div id="links-container">
                <div class="loading"><div class="spinner"></div></div>
              </div>
            </div>
          </main>
        </div>

        <!-- 添加/编辑模态框 -->
        <div id="link-modal" style="display:none;">
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
              <div class="modal-header">
                <h3 id="modal-title">添加友情链接</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="link-id">
                <div class="form-group">
                  <label>网站名称 *</label>
                  <input type="text" id="link-name" placeholder="如：我的博客">
                </div>
                <div class="form-group">
                  <label>链接地址 *</label>
                  <input type="url" id="link-url" placeholder="https://example.com">
                </div>
                <div class="form-group">
                  <label>描述</label>
                  <input type="text" id="link-desc" placeholder="简短描述（选填）">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>排序</label>
                    <input type="number" id="link-sort" value="0" placeholder="数字越小越靠前">
                  </div>
                  <div class="form-group">
                    <label>状态</label>
                    <select id="link-visible">
                      <option value="1">显示</option>
                      <option value="0">隐藏</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveLink()">保存</button>
              </div>
            </div>
          </div>
        </div>
      `;

      loadLinks();
    }

    async function loadLinks() {
      const container = document.getElementById('links-container');
      utils.showLoading(container);

      try {
        const { links } = await api.links.list();
        allLinks = links;
        
        if (links.length === 0) {
          utils.showEmpty(container, '还没有友情链接', '🔗');
          return;
        }

        container.innerHTML = renderLinksContent(links);
      } catch (e) {
        container.innerHTML = `<div class="alert alert-error">加载失败: ${e.message}</div>`;
      }
    }

    function renderLinksContent(links) {
      // 桌面端表格 + 移动端卡片列表
      return `
        <div class="links-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th>名称</th>
                <th class="col-url">链接</th>
                <th class="col-desc">描述</th>
                <th class="col-sort">排序</th>
                <th class="col-status">状态</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody>
              ${links.map(link => `
                <tr>
                  <td class="col-id" title="${utils.escapeHtml(link.id)}">${utils.escapeHtml(link.id)}</td>
                  <td style="font-weight:500;">${utils.escapeHtml(link.name)}</td>
                  <td class="col-url"><a href="${utils.escapeHtml(link.url)}" target="_blank">${utils.escapeHtml(link.url)}</a></td>
                  <td class="col-desc">${utils.escapeHtml(link.description || '-')}</td>
                  <td class="col-sort">${link.sort_order}</td>
                  <td class="col-status">
                    <span class="tag" style="background:${link.is_visible ? '#dcfce7;color:#166534' : '#f1f5f9;color:#64748b'};">
                      ${link.is_visible ? '显示' : '隐藏'}
                    </span>
                  </td>
                  <td class="col-actions">
                    <div class="table-actions">
                      <button class="btn btn-sm btn-secondary" onclick="editLinkById('${link.id}')">编辑</button>
                      <button class="btn btn-sm btn-danger" onclick="deleteLink('${link.id}')">删除</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="links-mobile-list">
          ${links.map(link => `
            <div class="link-card">
              <div class="link-card-header">
                <span class="link-card-name">${utils.escapeHtml(link.name)}</span>
                <span class="tag" style="background:${link.is_visible ? '#dcfce7;color:#166534' : '#f1f5f9;color:#64748b'};">
                  ${link.is_visible ? '显示' : '隐藏'}
                </span>
              </div>
              <div class="link-card-url">${utils.escapeHtml(link.url)}</div>
              ${link.description ? `<div class="link-card-desc">${utils.escapeHtml(link.description)}</div>` : ''}
              <div class="link-card-footer">
                <div class="link-meta">
                  <span>排序: ${link.sort_order}</span>
                  <span>ID: ${link.id}</span>
                </div>
                <div class="link-card-actions">
                  <button class="btn btn-secondary" onclick="editLinkById('${link.id}')">编辑</button>
                  <button class="btn btn-danger" onclick="deleteLink('${link.id}')">删除</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function showAddModal() {
      document.getElementById('modal-title').textContent = '添加友情链接';
      document.getElementById('link-id').value = '';
      document.getElementById('link-name').value = '';
      document.getElementById('link-url').value = 'https://';
      document.getElementById('link-desc').value = '';
      document.getElementById('link-sort').value = 0;
      document.getElementById('link-visible').value = '1';
      document.getElementById('link-modal').style.display = 'block';
    }

    function editLinkById(id) {
      const link = allLinks.find(l => l.id === id);
      if (!link) {
        utils.showMessage('链接不存在', 'error');
        return;
      }
      document.getElementById('modal-title').textContent = '编辑友情链接';
      document.getElementById('link-id').value = id;
      document.getElementById('link-name').value = link.name;
      document.getElementById('link-url').value = link.url;
      document.getElementById('link-desc').value = link.description || '';
      document.getElementById('link-sort').value = link.sort_order;
      document.getElementById('link-visible').value = link.is_visible ? '1' : '0';
      document.getElementById('link-modal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('link-modal').style.display = 'none';
    }

    async function saveLink() {
      const id = document.getElementById('link-id').value;
      const data = {
        name: document.getElementById('link-name').value.trim(),
        url: document.getElementById('link-url').value.trim(),
        description: document.getElementById('link-desc').value.trim(),
        sort_order: parseInt(document.getElementById('link-sort').value) || 0,
        is_visible: document.getElementById('link-visible').value === '1'
      };

      if (!data.name || !data.url) {
        utils.showMessage('请填写名称和链接地址', 'error');
        return;
      }

      try {
        if (id) {
          await api.links.update(id, data);
          utils.showMessage('更新成功', 'success');
        } else {
          await api.links.create(data);
          utils.showMessage('添加成功', 'success');
        }
        closeModal();
        loadLinks();
      } catch (e) {
        utils.showMessage(e.message, 'error');
      }
    }

    async function deleteLink(id) {
      if (!await utils.confirm('确定要删除这个链接吗？')) return;
      
      try {
        await api.links.delete(id);
        utils.showMessage('删除成功', 'success');
        loadLinks();
      } catch (e) {
        utils.showMessage(e.message, 'error');
      }
    }
  </script>
</body>
</html>
