<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的博客 - 分享技术与生活</title>
  <meta name="description" content="分享技术、生活与思考的个人博客">
  <meta name="keywords" content="博客,技术,编程,生活">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <div class="logo-icon">G</div>
        <span id="site-title">我的博客</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/" class="active">首页</a></li>
          <li><a href="/search.html">搜索</a></li>
          <li><a href="/contact.html">联系我</a></li>
          <li id="admin-link" style="display:none;"><a href="/admin/">管理</a></li>
        </ul>
      </nav>
      <div class="nav-right">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜索文章..." onkeypress="if(event.key==='Enter')doSearch()">
        </div>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="main-layout">
      <!-- 主内容区 -->
      <main>
        <div id="posts-container">
          <div class="loading"><div class="spinner"></div></div>
        </div>
        <div id="pagination"></div>
      </main>

      <!-- 侧边栏 -->
      <aside class="sidebar">
        <!-- 广告位 -->
        <div class="widget" id="ad-widget">
          <div class="ad-space">
            <div class="ad-space-title">广告位</div>
            <p style="font-size:13px;color:var(--text-light);">您的广告可以在这里展示</p>
          </div>
        </div>

        <!-- 友情链接 -->
        <div class="widget">
          <h3 class="widget-title">友情链接</h3>
          <ul class="links-list" id="links-list">
            <li style="color:var(--text-light);font-size:14px;">加载中...</li>
          </ul>
        </div>

        <!-- 热门文章 -->
        <div class="widget">
          <h3 class="widget-title">热门文章</h3>
          <ul class="links-list" id="popular-posts">
            <li style="color:var(--text-light);font-size:14px;">加载中...</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h4>关于博客</h4>
        <p id="footer-desc">这是一个分享技术与生活的个人博客，记录成长的点滴。</p>
      </div>
      <div class="footer-section">
        <h4>快速链接</h4>
        <ul>
          <li><a href="/">首页</a></li>
          <li><a href="/search.html">搜索</a></li>
          <li><a href="/contact.html">联系我</a></li>
          <li><a href="/admin/login.html">管理员登录</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h4>联系方式</h4>
        <p id="footer-contact">邮箱: admin@example.com</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; <span id="current-year"></span> 我的博客. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    // 页面初始化
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      // 加载设置
      try {
        const { settings } = await api.settings.get();
        if (settings.site_title) {
          document.title = settings.site_title;
          document.getElementById('site-title').textContent = settings.site_title;
        }
        if (settings.site_description) {
          document.getElementById('footer-desc').textContent = settings.site_description;
        }
        if (settings.contact_info) {
          document.getElementById('footer-contact').innerHTML = settings.contact_info.replace(/\n/g, '<br>');
        }
        if (settings.seo_keywords) {
          const metaKeywords = document.querySelector('meta[name="keywords"]');
          if (metaKeywords) metaKeywords.content = settings.seo_keywords;
        }
        if (settings.ad_code) {
          document.getElementById('ad-widget').innerHTML = settings.ad_code;
        }
      } catch (e) {
        console.error('加载设置失败', e);
      }

      // 检查登录状态
      if (api.isLoggedIn()) {
        document.getElementById('admin-link').style.display = 'block';
      }

      // 加载文章
      const page = parseInt(utils.getQueryParam('page') || '1');
      loadPosts(page);
      
      // 加载友情链接
      loadLinks();
      
      // 加载热门文章
      loadPopularPosts();
    });

    // 加载文章列表
    async function loadPosts(page = 1) {
      const container = document.getElementById('posts-container');
      utils.showLoading(container);

      try {
        const data = await api.posts.list(page, 10, 'published');
        
        if (data.posts.length === 0) {
          utils.showEmpty(container, '还没有文章', '✍️');
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        container.innerHTML = data.posts.map(post => `
          <article class="card post-card">
            <h2><a href="/post.html?slug=${post.slug}">${utils.escapeHtml(post.title)}</a></h2>
            <div class="post-meta">
              <span>📅 ${utils.formatDate(post.created_at)}</span>
              <span>👁️ ${post.views} 阅读</span>
              ${post.status === 'draft' ? '<span style="color:var(--warning);">📝 草稿</span>' : ''}
            </div>
            <p class="post-summary">${utils.escapeHtml(post.summary || '')}</p>
            <a href="/post.html?slug=${post.slug}" class="btn btn-primary btn-sm">阅读全文 →</a>
          </article>
        `).join('');

        // 分页
        renderPagination(page, data.totalPages);
      } catch (e) {
        container.innerHTML = `<div class="alert alert-error">加载失败: ${e.message}</div>`;
      }
    }

    // 渲染分页
    function renderPagination(currentPage, totalPages) {
      const pagination = document.getElementById('pagination');
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let html = '<div class="pagination">';
      
      // 上一页
      if (currentPage > 1) {
        html += `<a href="/?page=${currentPage - 1}">← 上一页</a>`;
      } else {
        html += `<span class="disabled">← 上一页</span>`;
      }

      // 页码
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += i === currentPage 
            ? `<span class="current">${i}</span>`
            : `<a href="/?page=${i}">${i}</a>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += `<span>...</span>`;
        }
      }

      // 下一页
      if (currentPage < totalPages) {
        html += `<a href="/?page=${currentPage + 1}">下一页 →</a>`;
      } else {
        html += `<span class="disabled">下一页 →</span>`;
      }

      html += '</div>';
      pagination.innerHTML = html;
    }

    // 加载友情链接
    async function loadLinks() {
      try {
        const { links } = await api.links.list();
        const list = document.getElementById('links-list');
        
        if (links.length === 0) {
          list.innerHTML = '<li style="color:var(--text-light);font-size:14px;">暂无链接</li>';
          return;
        }

        list.innerHTML = links.map(link => `
          <li>
            <a href="${utils.escapeHtml(link.url)}" target="_blank" rel="noopener" title="${utils.escapeHtml(link.description || '')}">
              <span class="link-icon">${link.name.charAt(0).toUpperCase()}</span>
              <span>${utils.escapeHtml(link.name)}</span>
            </a>
          </li>
        `).join('');
      } catch (e) {
        document.getElementById('links-list').innerHTML = '<li style="color:var(--danger);font-size:14px;">加载失败</li>';
      }
    }

    // 加载热门文章
    async function loadPopularPosts() {
      try {
        const data = await api.posts.list(1, 5, 'published');
        const posts = data.posts.sort((a, b) => b.views - a.views).slice(0, 5);
        const list = document.getElementById('popular-posts');
        
        if (posts.length === 0) {
          list.innerHTML = '<li style="color:var(--text-light);font-size:14px;">暂无文章</li>';
          return;
        }

        list.innerHTML = posts.map(post => `
          <li>
            <a href="/post.html?slug=${post.slug}">
              <span class="link-icon">🔥</span>
              <span style="font-size:13px;">${utils.escapeHtml(post.title)}</span>
            </a>
          </li>
        `).join('');
      } catch (e) {
        console.error('加载热门文章失败', e);
      }
    }

    // 搜索
    function doSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (query) {
        window.location.href = `/search.html?q=${encodeURIComponent(query)}`;
      }
    }

    // 移动端菜单
    function toggleMobileMenu() {
      const navLinks = document.querySelector('.nav-links');
      if (navLinks.style.display === 'flex') {
        navLinks.style.display = '';
      } else {
        navLinks.style.display = 'flex';
        navLinks.style.flexDirection = 'column';
        navLinks.style.position = 'absolute';
        navLinks.style.top = '64px';
        navLinks.style.left = '0';
        navLinks.style.right = '0';
        navLinks.style.background = 'white';
        navLinks.style.padding = '16px';
        navLinks.style.boxShadow = 'var(--shadow-md)';
      }
    }
  </script>
</body>
</html>
